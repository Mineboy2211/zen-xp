  /* ================== ÉCRAN DE DÉMARRAGE ================== */
  .screen { position: fixed; inset: 0; z-index: 10; }
  .screen.hide { display: none !important; }
  #boot { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px; }
  .logo { display: flex; align-items: flex-end; gap: 10px; }
  #boot .flag { width: 64px; height: 56px; }
  .brand { color: #fff; line-height: 1; }
  .brand small { display: block; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; margin-bottom: 1px; }
  .brand b { font-family: "Franklin Gothic Medium", Arial, sans-serif; font-size: 44px; font-weight: normal; letter-spacing: -1px; }
  .brand b sup { color: #ff6a00; font-size: 24px; font-style: italic; font-weight: bold; margin-left: 2px; }
  .bar { width: 154px; height: 18px; border: 2px solid #b2b2b2; border-radius: 3px; position: relative; overflow: hidden; }
  .bar .blocks { position: absolute; top: 2px; display: flex; gap: 2px; animation: slide 2.2s steps(22) infinite; }
  .bar .blocks i { width: 8px; height: 10px; background: linear-gradient(180deg, #2838c7 0 25%, #3c74ff 25% 45%, #6b97ff 45% 60%, #3c74ff 60% 80%, #2838c7 80%); }
  @keyframes slide { from { left: -32px; } to { left: 154px; } }
  .copy { position: absolute; bottom: 18px; left: 24px; color: #fff; font-family: Arial, sans-serif; font-size: 11px; }
  .skip { position: absolute; bottom: 18px; right: 24px; color: #666; font-family: Tahoma, sans-serif; font-size: 11px; }

  /* ================== OUVERTURE DE SESSION ================== */
  #logon, #welcome { background: #5a7edc; display: flex; flex-direction: column; font-family: Tahoma, sans-serif; }
  .top, .bot { height: 78px; background: #00309c; flex: none; }
  .top { border-bottom: 2px solid #fff; border-image: linear-gradient(90deg, #5a7edc 0 10%, #adc3ef 10% 25%, #fff 25% 75%, #adc3ef 75% 90%, #5a7edc 90%) 1; }
  .bot { border-top: 2px solid #f28f23; border-image: linear-gradient(90deg, #00309c 0 10%, #c66f1d 10% 25%, #f28f23 25% 75%, #c66f1d 75% 90%, #00309c 90%) 1;
          display: flex; align-items: center; padding: 0 26px; color: #fff; font-size: 13px; }
  .mid { flex: 1; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse 75% 95% at 18% 0%, #a6c0f2 0.0% 12.5%, #9bb7ef 12.5% 25.0%, #90adec 25.0% 37.5%, #85a4e9 37.5% 50.0%, #7b9ae5 50.0% 62.5%, #7091e2 62.5% 75.0%, #6587df 75.0% 87.5%, #5a7edc 87.5% 100.0%); }
  #logon .left { width: 42%; text-align: right; padding-right: 30px; color: #fff; }
  #logon .mini { display: inline-flex; align-items: flex-end; gap: 6px; margin-bottom: 22px; }
  #logon .mini .flag { width: 48px; height: 42px; }
  #logon .mini .brand b { font-size: 34px; }
  #logon .mini .brand b sup { font-size: 18px; }
  #logon .left p { font-size: 15px; font-weight: bold; }
  .sep { width: 1px; align-self: stretch; margin: 50px 0; background: linear-gradient(180deg, #5a7edc 0 8%, #8fa8ea 8% 20%, #c6d6f7 20% 80%, #8fa8ea 80% 92%, #5a7edc 92%); }
  #logon .right { width: 42%; padding-left: 30px; }
  .user { display: inline-flex; align-items: center; gap: 12px; padding: 6px 46px 6px 6px; cursor: pointer; color: #fff; }
  .user:hover { background: linear-gradient(90deg, #00309c 0 30%, #1a46ab 30% 55%, #3a5fc0 55% 80%, transparent 80%); }
  .user .av { width: 50px; height: 50px; border: 2px solid #fff; background: #fff; overflow: hidden; flex: none; }
  .user .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .user .av img.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
  .user:hover .av { border-color: #ffc73c; }
  .user span { font-size: 18px; }
  .off { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .off i { width: 22px; height: 22px; border: 1px solid #fff; background: linear-gradient(180deg, #ea7a4f 0 50%, #c8461b 50%); display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: bold; }

  /* ================== BIENVENUE ================== */
  #welcome .mid { justify-content: flex-start; padding-left: 12%; }
  #welcome h1 { color: #fff; font-family: Verdana, Tahoma, sans-serif; font-size: 52px; font-style: italic; font-weight: bold; text-shadow: 2px 2px 0 #3150a8; }

  /* ================== FENÊTRE « CHANGER D'IMAGE » ================== */

  const LS = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  function pixelFor(nom) {
    let h = 0; for (const c of nom) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const k = Object.keys(AVATARS); return AVATARS[k[h % k.length]];
  }
  function profil() {
    const local = window.ZENXP_PROFIL || {}, perso = LS.get("zenxp-profil") || {};
    const nom = perso.nom || local.nom || t("user");
    return { nom, photo: perso.photo || local.photo || null, secours: pixelFor(nom) };
  }
  function setImg(box, src, secours) {
    box.innerHTML = "";
    const img = document.createElement("img");
    const isPixel = s => s && s.startsWith("data:image/png;base64,") && Object.values(AVATARS).includes(s);
    img.onerror = () => { img.onerror = null; img.src = secours; img.className = "pixel"; };
    img.src = src || secours;
    if (!src || isPixel(src)) img.className = "pixel";
    box.appendChild(img);
  }
  function applyProfil() {
    const p = profil();
    document.getElementById("nom").textContent = p.nom;
    setImg(document.getElementById("av"), p.photo, p.secours);
  }
  applyProfil();

  // ---------- Fond d'écran ----------
  function applyWall() {
    const el = document.querySelector(".bliss");
    const perso = LS.get("zenxp-fond");
    const essais = [perso, "file:///C:/Users/Utilisateur/Pictures/Bliss.png"].filter(Boolean);
    (function next() {
      const src = essais.shift();
      if (!src) { el.style.backgroundImage = ""; return; }
      const im = new Image();
      im.onload = () => { el.style.backgroundImage = `url("${src}")`; };
      im.onerror = next;
      im.src = src;
    })();
  }
  applyWall();

  // ---------- Fenêtre « Comptes d'utilisateurs » ----------
  const dlg = document.getElementById("dlgBack");
  let brouillon = {};
  function reduire(file, max, qualite) {
    return new Promise((ok, ko) => {
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement("canvas");
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          ok(c.toDataURL("image/jpeg", qualite));
        };
        im.onerror = ko; im.src = r.result;
      };
      r.onerror = ko; r.readAsDataURL(file);
    });
  }
  function majApercu() {
    const nom = document.getElementById("dlgNom").value.trim() || t("user");
    setImg(document.getElementById("dlgPrev"), brouillon.photo, pixelFor(nom));
    document.querySelectorAll("#dlgGrid img").forEach(i => i.classList.toggle("sel", i.src === brouillon.photo));
  }
  function ouvrirDlg() {
    const p = profil(), perso = LS.get("zenxp-profil") || {};
    brouillon = { photo: perso.photo || null, fond: undefined };
    document.getElementById("dlgNom").value = perso.nom || (window.ZENXP_PROFIL || {}).nom || "";
    document.getElementById("dlgNom").placeholder = t("user");
    majApercu();
    dlg.classList.add("open");
  }
  const grid = document.getElementById("dlgGrid");
  for (const [n, src] of Object.entries(AVATARS)) {
    const i = document.createElement("img"); i.src = src; i.title = n; i.className = "pixel";
    i.onclick = () => { brouillon.photo = src; majApercu(); };
    grid.appendChild(i);
  }
  document.querySelectorAll("[data-open-dlg]").forEach(e => e.addEventListener("click", ev => { ev.stopPropagation(); ouvrirDlg(); }));
  document.getElementById("user").addEventListener("contextmenu", e => { e.preventDefault(); ouvrirDlg(); });
  document.getElementById("dlgNom").addEventListener("input", majApercu);
  document.getElementById("dlgUpload").onclick = () => document.getElementById("fileAv").click();
  document.getElementById("dlgWall").onclick = () => document.getElementById("fileWall").click();
  document.getElementById("fileAv").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    brouillon.photo = await reduire(f, 128, .9); majApercu(); e.target.value = "";
  };
  document.getElementById("fileWall").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    brouillon.fond = await reduire(f, 1920, .82); e.target.value = "";
    document.getElementById("dlgWall").textContent = t("img_chosen");
  };
  document.getElementById("dlgDefault").onclick = () => { brouillon.photo = null; majApercu(); };
  document.getElementById("dlgWallReset").onclick = () => { brouillon.fond = null; document.getElementById("dlgWall").textContent = t("browse"); };
  function fermerDlg() { dlg.classList.remove("open"); document.getElementById("dlgWall").textContent = t("browse"); }
  document.getElementById("dlgOk").onclick = () => {
    const nom = document.getElementById("dlgNom").value.trim();
    LS.set("zenxp-profil", (nom || brouillon.photo) ? { nom: nom || null, photo: brouillon.photo } : null);
    if (brouillon.fond !== undefined && !LS.set("zenxp-fond", brouillon.fond)) alert(t("too_big"));
    applyProfil(); applyWall(); fermerDlg();
  };
  document.getElementById("dlgCancel").onclick = fermerDlg;
  document.getElementById("dlgX").onclick = fermerDlg;
  dlg.addEventListener("click", e => { if (e.target === dlg) fermerDlg(); });

  // ---------- Horloge ----------
  function tick() {
    const d = new Date();
    document.getElementById("clock").textContent = d.toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
    const s = d.toLocaleDateString(LANG, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    document.getElementById("date").textContent = s.charAt(0).toUpperCase() + s.slice(1);
  }
  tick(); setInterval(tick, 1000);

  document.querySelector("form").addEventListener("submit", e => setTimeout(() => e.target.q.value = "", 100));

  // ---------- Séquence de démarrage ----------
  const $ = id => document.getElementById(id);
  const boot = $("boot"), logon = $("logon"), welcome = $("welcome");
  let stage = "boot", bootTimer;

  function store(get) {
    try { return get ? sessionStorage.getItem("zenxp-started") : sessionStorage.setItem("zenxp-started", "1"); }
    catch (e) { return null; }
  }

  function showDesktop() {
    stage = "desk";
    [boot, logon, welcome].forEach(s => s.classList.add("hide"));
    document.body.classList.add("desk-in");
    store(false);
    setTimeout(() => $("q").focus(), 650);
  }
  function showLogon() {
    if (stage !== "boot") return;
    clearTimeout(bootTimer);
    stage = "logon";
    logon.classList.remove("hide");
    boot.classList.add("hide");
  }
  function showWelcome() {
    if (stage !== "logon") return;
    stage = "welcome";
    welcome.classList.remove("hide");
    logon.classList.add("hide");
    setTimeout(showDesktop, 1600);
  }

  if (store(true)) {
    // Déjà démarré dans cet onglet : direct au bureau
    boot.classList.add("hide");
    showDesktop();
  } else {
    bootTimer = setTimeout(showLogon, 3200);
    boot.addEventListener("click", showLogon);
    $("user").addEventListener("click", showWelcome);
    $("off").addEventListener("click", showDesktop);
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { if (dlg.classList.contains("open")) fermerDlg(); else showDesktop(); }
      else if (e.key === "Enter" && stage === "logon") showWelcome();
    });
  }
</script>
